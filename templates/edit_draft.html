<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Draft - VFX Email Outreach CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container" style="max-width: 800px;">
    <div class="header" style="text-align: left; margin-bottom: 20px;">
        <div class="flex justify-between align-center">
            <h1>✍️ Review & Edit Draft</h1>
            <a href="/" class="btn btn-secondary">← Back</a>
        </div>
    </div>
    
    <div class="info-box">
        <h4 style="margin-bottom: 10px; color: var(--text);">Lead Information:</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; color: var(--text-muted);">
            <div><strong>Name:</strong> <span style="color: var(--text);">{{ lead.name }}</span></div>
            <div><strong>Company:</strong> <span style="color: var(--text);">{{ lead.company }} ({{ lead.role }})</span></div>
            <div><strong>Email:</strong> <span style="color: var(--text);">{{ lead.email }}</span></div>
            <div><strong>Service Needed:</strong> <span style="color: var(--text);">{{ lead.service_needed }}</span></div>
        </div>
    </div>

    <div class="card">
        <form action="/save_draft/{{ lead.id }}" method="post">
            <div class="form-group">
                <label for="subject">Subject Line</label>
                <input type="text" id="subject" name="subject" value="{{ draft.subject }}" required>
            </div>
            
            <div class="form-group">
                <label for="body">Email Body</label>
                <textarea id="body" name="body" required style="font-family: 'Inter', sans-serif;">{{ draft.body }}</textarea>
            </div>
            
            <div class="flex gap-10 mt-20">
                <button type="submit" name="action" value="save" class="btn btn-primary">Save as Draft</button>
                <button type="submit" name="action" value="approve" class="btn btn-success">✅ Save & Approve</button>
                <a href="/" class="btn btn-secondary" style="margin-left: auto;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
